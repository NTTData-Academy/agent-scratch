# CI/CD del agente del equipo en el sandbox del workshop.
#  - Pull request, push a main o a solution, y tags t*-v*: tests en contenedor. No toca Azure.
#  - Push a main (el merge de un PR): además construye la imagen, comprueba que arranca, la publica en el ACR
#    (repositorio team-NN/agent) y actualiza la Container App del equipo cambiando solo la imagen.
# Azure solo confía en tokens OIDC de este repo y de la rama main (credencial federada): sin secretos ni environments
# de GitHub (un job con `environment:` emite otro sujeto OIDC y el login fallaría).
# Variables del repositorio (Settings > Secrets and variables > Actions > Variables): ver devops/DESPLIEGUE.md.
# Si ACR_LOGIN_SERVER no está definida, solo corre el job de tests.
name: deploy-agent

on:
  push:
    branches: [main, solution]
    tags: ["t*-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests en contenedor (stage test)
        run: |
          docker build -f devops/Dockerfile --target test -t agent:test .
          docker run --rm agent:test

  deploy:
    # Solo desde main (también si se lanza a mano): la credencial federada de Azure es solo de esa rama.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ACR_LOGIN_SERVER != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write # token OIDC para azure/login
      contents: read
    concurrency:
      group: desplegar-agente
      cancel-in-progress: false
    env:
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      CONTAINER_APP: ${{ vars.CONTAINER_APP }}
      DOMAIN: ${{ vars.DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar las variables y calcular la imagen
        run: |
          fail() { echo "::error::$1"; exit 1; }
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [ -n "$(printenv "$v")" ] || fail "Falta la variable $v del repositorio (ver devops/DESPLIEGUE.md)."
          done
          [ -n "$RESOURCE_GROUP" ] || fail "Falta la variable RESOURCE_GROUP del repositorio."
          [[ "$CONTAINER_APP" =~ ^ca-agent-chat-([0-9]{2})$ ]] || fail "CONTAINER_APP debe ser ca-agent-chat-NN (valor: '$CONTAINER_APP')."
          team="${BASH_REMATCH[1]}"
          case "$DOMAIN" in
            fraud|fees|cards|loans|support) ;;
            *) fail "DOMAIN debe ser fraud, fees, cards, loans o support (valor: '$DOMAIN')." ;;
          esac
          # El ACR solo deja publicar en team-NN/ (ABAC): el repositorio de la imagen lleva el número del equipo.
          echo "IMAGE=$ACR_LOGIN_SERVER/team-$team/agent:$GITHUB_SHA" >> "$GITHUB_ENV"
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login a Azure (OIDC, sin secretos)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Construir la imagen runtime y comprobar que arranca
        run: |
          docker build -f devops/Dockerfile --target runtime \
            --build-arg DOMAIN="$DOMAIN" --build-arg GIT_SHA="$GITHUB_SHA" -t "$IMAGE" .
          # Como en Azure: Terraform da AZURE_OPENAI_ENDPOINT (no FOUNDRY_ENDPOINT); la key es de relleno (no se llama a Foundry).
          # Hasta la sesión 3 el agente responde /health. Desde la 4 no arranca sin su base de conocimiento (y desde la 6 sin
          # su MCP), y el CI no tiene ninguno: basta con que llegue a pedir AI Search. El arranque real lo confirma el paso
          # "Esperar a que la revisión nueva esté activa".
          docker run -d --name agent-check -p 8000:8000 \
            -e AZURE_OPENAI_ENDPOINT=http://127.0.0.1:1 -e FOUNDRY_AUTH_PROVIDER=api_key -e FOUNDRY_API_KEY=ci "$IMAGE"
          ok=0
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health; then ok=1; break; fi
            [ "$(docker inspect -f '{{.State.Running}}' agent-check)" = true ] || break
            sleep 2
          done
          logs=$(docker logs agent-check 2>&1)
          if [ "$ok" = 1 ]; then
            docker exec agent-check sh -c 'tr "\0" "\n" < /proc/1/environ' | grep -qx 'FOUNDRY_ENDPOINT=http://127.0.0.1:1' \
              || { echo "::error::La imagen no copió AZURE_OPENAI_ENDPOINT a FOUNDRY_ENDPOINT."; exit 1; }
          elif echo "$logs" | grep -q "Foundry auth provider" \
            && echo "$logs" | grep -q "KNOWLEDGE_BASE=azure_search requiere SEARCH_ENDPOINT"; then
            echo "El agente llegó a pedir AI Search: la imagen arranca."
          else
            echo "$logs"
            echo "::error::El contenedor no respondió en /health ni llegó a pedir AI Search."
            exit 1
          fi
          docker rm -f agent-check

      - name: Publicar la imagen en el ACR (solo team-NN/)
        run: |
          az acr login --name "${ACR_LOGIN_SERVER%%.*}"
          docker push "$IMAGE"

      - name: Desplegar en la Container App del equipo (solo cambia la imagen)
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --image "$IMAGE" \
            --query "properties.latestRevisionName" -o tsv

      - name: Esperar a que la revisión nueva esté activa
        run: |
          rev=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query "properties.latestRevisionName" -o tsv)
          for i in $(seq 1 18); do
            state=$(az containerapp revision show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --revision "$rev" \
              --query "properties.runningState" -o tsv)
            echo "$rev: $state"
            case "$state" in
              Running*) exit 0 ;;
              *Failed*) echo "::error::La revisión no arrancó: revisa los logs de $CONTAINER_APP."; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::La revisión $rev no llegó a Running en 3 minutos (estado: $state)."
          exit 1
